<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Puntuaciones del Finde</title>
  <style>
    :root {
      --bg: #0f172a; --card: #1e293b; --text: #f8fafc;
      --muted: #94a3b8; --accent: #3b82f6; --success: #10b981;
      --danger: #ef4444; --border: #334155;
    }
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { background: var(--bg); color: var(--text); margin: 0; padding: 20px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 850px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 20px; }
    h2, h3 { margin-top: 0; }
    input, select, button { padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border); background: #0f172a; color: var(--text); font-size: 14px; }
    button { background: var(--accent); border: none; font-weight: 600; cursor: pointer; transition: opacity 0.2s; }
    button:hover { opacity: 0.9; }
    button.secondary { background: #475569; }
    button.danger { background: var(--danger); padding: 6px 10px; }
    .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    .row input, .row select { flex: 1; min-width: 140px; }
    .hidden { display: none !important; }
    .topbar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 16px; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { text-align: left; padding: 12px 8px; border-bottom: 1px solid var(--border); }
    th { color: var(--muted); font-size: 12px; text-transform: uppercase; }
    .badge { background: #334155; padding: 4px 8px; border-radius: 6px; font-size: 12px; display: inline-block; margin: 2px; }
    .promedio { font-size: 18px; font-weight: bold; color: var(--success); }
    .vote-box { display: flex; gap: 6px; }
    .vote-box input { width: 65px; text-align: center; }
  </style>
</head>
<body>

<div class="container">
  <!-- ENTRADA CON NOMBRE -->
  <div id="login-view" class="card">
    <h2>🏆 Puntuaciones del Fin de Semana</h2>
    <p style="color: var(--muted);">Escribí tu nombre para entrar a votar (sin contraseñas).</p>
    <div class="row">
      <input type="text" id="username-input" placeholder="Tu nombre (ej: Nahu)" onkeydown="if(event.key==='Enter') entrar()">
      <button onclick="entrar()">Entrar</button>
    </div>
  </div>

  <!-- PANTALLA PRINCIPAL -->
  <div id="app-view" class="hidden">
    <div class="topbar">
      <div>
        <h2 style="margin:0;">📅 Fin de Semana</h2>
        <div style="margin-top: 6px;">
          <label style="color: var(--muted); font-size: 13px;">Viendo semana: </label>
          <select id="semana-select" onchange="cambiarSemana(this.value)"></select>
        </div>
      </div>
      <div>
        <span id="user-badge" style="margin-right: 10px; font-weight: bold;"></span>
        <button class="secondary" onclick="cambiarUsuario()">Cambiar Nombre</button>
      </div>
    </div>

    <div class="card">
      <h3>➕ Agregar a la lista de esta semana</h3>
      <div class="row">
        <input type="text" id="item-nombre" placeholder="Nombre (actriz, persona, equipo...)" onkeydown="if(event.key==='Enter') agregarItem()">
        <select id="item-categoria">
          <option value="Persona / Actriz">Persona / Actriz</option>
          <option value="Equipo">Equipo</option>
          <option value="Película / Serie">Película / Serie</option>
          <option value="Otro">Otro</option>
        </select>
        <button onclick="agregarItem()">Agregar</button>
      </div>
    </div>

    <div class="card">
      <h3>📊 Lista y Promedios</h3>
      <table>
        <thead>
          <tr>
            <th>Nombre</th>
            <th>Categoría</th>
            <th>Votos</th>
            <th>Promedio</th>
            <th>Tu Nota (1-10)</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="tabla-body"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
  // =========================================================================
  // PEGÁ ACÁ EL LINK DE TU FIREBASE REALTIME DATABASE (sin barra / al final)
  // Ejemplo: "https://puntuaciones-finde-default-rtdb.firebaseio.com"
  // =========================================================================
  const FIREBASE_URL = "PEGAR_TU_LINK_DE_FIREBASE_ACA";

  let usuarioActual = localStorage.getItem("nombre_usuario_finde") || "";
  let semanaSeleccionada = "";

  // Calcula el sábado y domingo de la semana actual automáticamente
  function obtenerSemanaActual() {
    const hoy = new Date();
    const dia = hoy.getDay(); // 0 es Domingo, 6 es Sábado
    const diffSabado = dia === 0 ? -1 : 6 - dia;
    
    const sabado = new Date(hoy);
    sabado.setDate(hoy.getDate() + diffSabado);
    
    const domingo = new Date(sabado);
    domingo.setDate(sabado.getDate() + 1);

    const fmt = (d) => d.toLocaleDateString('es-AR', { day: '2-digit', month: '2-digit', year: 'numeric' });
    return `${fmt(sabado)} al ${fmt(domingo)}`;
  }

  function formatearNombre(nombre) {
    const limpio = nombre.trim();
    return limpio.charAt(0).toUpperCase() + limpio.slice(1).toLowerCase();
  }

  function entrar() {
    const input = document.getElementById("username-input").value;
    if (!input.trim()) return alert("Escribí tu nombre primero");
    usuarioActual = formatearNombre(input);
    localStorage.setItem("nombre_usuario_finde", usuarioActual);
    actualizarPantalla();
  }

  function cambiarUsuario() {
    localStorage.removeItem("nombre_usuario_finde");
    usuarioActual = "";
    actualizarPantalla();
  }

  function cambiarSemana(nuevaSemana) {
    semanaSeleccionada = nuevaSemana;
    cargarDatos();
  }

  async function agregarItem() {
    const nombre = document.getElementById("item-nombre").value.trim();
    const categoria = document.getElementById("item-categoria").value;
    if (!nombre) return alert("Escribí un nombre primero");

    const semanaActiva = semanaSeleccionada || obtenerSemanaActual();
    const nuevoItem = {
      nombre: nombre,
      categoria: categoria,
      semana: semanaActiva,
      timestamp: Date.now(),
      votos: {}
    };

    await fetch(`${FIREBASE_URL}/items.json`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(nuevoItem)
    });

    document.getElementById("item-nombre").value = "";
    cargarDatos();
  }

  async function votar(itemId) {
    const val = parseFloat(document.getElementById(`nota-${itemId}`).value);
    if (isNaN(val) || val < 1 || val > 10) return alert("Poné una nota del 1 al 10");

    // Guarda el voto bajo el nombre normalizado (ej: "Nahu": 9)
    // Si vuelve a votar con el mismo nombre, sobrescribe su propia nota
    await fetch(`${FIREBASE_URL}/items/${itemId}/votos/${encodeURIComponent(usuarioActual)}.json`, {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(val)
    });

    cargarDatos();
  }

  async function borrarItem(itemId) {
    if (!confirm("¿Seguro que querés borrar este personaje de la lista?")) return;
    await fetch(`${FIREBASE_URL}/items/${itemId}.json`, { method: "DELETE" });
    cargarDatos();
  }

  async function cargarDatos() {
    if (FIREBASE_URL.includes("PEGAR_TU_LINK")) {
      document.getElementById("tabla-body").innerHTML = `<tr><td colspan="6" style="color:#ef4444; text-align:center;">⚠️ Falta pegar tu link de Firebase en la línea const FIREBASE_URL del index.html</td></tr>`;
      return;
    }

    const res = await fetch(`${FIREBASE_URL}/items.json`);
    const data = await res.json() || {};

    const semanaActual = obtenerSemanaActual();
    if (!semanaSeleccionada) semanaSeleccionada = semanaActual;

    // Convertir el objeto de Firebase en una lista
    const todosLosItems = Object.entries(data).map(([id, val]) => ({ id, ...val }));

    // Armar lista de semanas para el historial
    const semanasSet = new Set([semanaActual]);
    todosLosItems.forEach(item => { if (item.semana) semanasSet.add(item.semana); });
    const listaSemanas = Array.from(semanasSet);

    const select = document.getElementById("semana-select");
    select.innerHTML = "";
    listaSemanas.forEach(sem => {
      const opt = document.createElement("option");
      opt.value = sem;
      opt.textContent = sem === semanaActual ? `${sem} (Actual)` : sem;
      if (sem === semanaSeleccionada) opt.selected = true;
      select.appendChild(opt);
    });

    // Filtrar ítems por la semana seleccionada
    const itemsSemana = todosLosItems
      .filter(i => i.semana === semanaSeleccionada)
      .sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));

    const tbody = document.getElementById("tabla-body");
    tbody.innerHTML = "";

    if (itemsSemana.length === 0) {
      tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; color: var(--muted);">Todavía no hay personajes cargados en esta semana.</td></tr>`;
      return;
    }

    itemsSemana.forEach(item => {
      const votosObj = item.votos || {};
      const listaVotos = Object.entries(votosObj); // [["Nahu", 9], ["Amigo", 8]]

      const notasNumericas = listaVotos.map(([_, nota]) => Number(nota));
      const promedio = notasNumericas.length > 0
        ? (notasNumericas.reduce((a, b) => a + b, 0) / notasNumericas.length).toFixed(2)
        : "-";

      const votosHtml = listaVotos.length > 0
        ? listaVotos.map(([user, nota]) => `<span class="badge">${user}: <b>${nota}</b></span>`).join("")
        : `<span style="color: var(--muted); font-size: 13px;">Sin votos</span>`;

      const miNota = votosObj[usuarioActual] !== undefined ? votosObj[usuarioActual] : "";

      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td><strong>${item.nombre}</strong></td>
        <td><span class="badge">${item.categoria}</span></td>
        <td>${votosHtml}</td>
        <td class="promedio">${promedio}</td>
        <td>
          <div class="vote-box">
            <input type="number" id="nota-${item.id}" min="1" max="10" step="0.5" value="${miNota}" placeholder="1-10">
            <button onclick="votar('${item.id}')">Votar</button>
          </div>
        </td>
        <td>
          <button class="danger" onclick="borrarItem('${item.id}')" title="Borrar">🗑️</button>
        </td>
      `;
      tbody.appendChild(tr);
    });
  }

  function actualizarPantalla() {
    if (usuarioActual) {
      document.getElementById("login-view").classList.add("hidden");
      document.getElementById("app-view").classList.remove("hidden");
      document.getElementById("user-badge").textContent = `👤 ${usuarioActual}`;
      cargarDatos();
    } else {
      document.getElementById("login-view").classList.remove("hidden");
      document.getElementById("app-view").classList.add("hidden");
    }
  }

  actualizarPantalla();
</script>

</body>
</html>
